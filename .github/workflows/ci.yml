name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check (compileall)
        run: python -m compileall -q AIRadar sdradi deeplearning rf_stream sdrpysim WebApp
      - name: Install ruff
        # Pinned so a future ruff release cannot turn CI red without a code change.
        run: pip install ruff==0.16.3
      - name: Lint test suite
        if: always()
        run: ruff check tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run test suite
        run: pytest tests/ -v
